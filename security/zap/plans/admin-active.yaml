# admin-active: active scan as the seeded admin session.
# Target is the app container on the internal network only. Caps are in minutes.
env:
  contexts:
    - name: skyvault
      urls:
        - http://sv-zap-app:3000
      includePaths:
        - http://sv-zap-app:3000.*
  parameters:
    failOnError: false
    failOnWarning: false
    progressToStdout: true
jobs:
  - type: replacer
    parameters:
      deleteAllRules: true
    rules:
      - description: session cookie
        matchType: req_header
        matchString: Cookie
        replacementString: "${SV_SESSION_COOKIE}"
  - type: requestor
    requests:
      - url: http://sv-zap-app:3000/api/auth/session
        method: GET
      - url: http://sv-zap-app:3000/api/auth/register
        method: GET
      - url: http://sv-zap-app:3000/api/properties
        method: GET
      - url: http://sv-zap-app:3000/api/properties/svzap-property-a
        method: GET
      - url: http://sv-zap-app:3000/api/surveys
        method: GET
      - url: http://sv-zap-app:3000/api/surveys/svzap-survey-s1
        method: GET
      - url: http://sv-zap-app:3000/api/surveys/svzap-survey-s1/images
        method: GET
      - url: http://sv-zap-app:3000/api/surveys/svzap-survey-s1/images/presign
        method: GET
      - url: http://sv-zap-app:3000/api/surveys/svzap-survey-s1/analyse
        method: GET
      - url: http://sv-zap-app:3000/api/surveys/svzap-survey-s1/roofer-request
        method: GET
      - url: http://sv-zap-app:3000/api/photos/svzap-image-s1/tag
        method: GET
      - url: http://sv-zap-app:3000/api/stripe/webhook
        method: GET
      - url: http://sv-zap-app:3000/api/admin/impersonate
        method: GET
      - url: http://sv-zap-app:3000/api/admin/reports/svzap-report-s2
        method: GET
      - url: http://sv-zap-app:3000/api/admin/reports/svzap-report-s2/approve
        method: GET
      - url: http://sv-zap-app:3000/api/admin/reports/svzap-report-s2/resend-email
        method: GET
      - url: http://sv-zap-app:3000/api/admin/roofer-requests/svzap-lead-s2
        method: GET
      - url: http://sv-zap-app:3000/api/admin/users/svzap-user-customer-b
        method: GET
      - url: http://sv-zap-app:3000/admin/dashboard
        method: GET
      - url: http://sv-zap-app:3000/admin/reports
        method: GET
      - url: http://sv-zap-app:3000/admin/reports/svzap-report-s2
        method: GET
      - url: http://sv-zap-app:3000/admin/reports/svzap-report-s3
        method: GET
      - url: http://sv-zap-app:3000/admin/roofer-requests
        method: GET
      - url: http://sv-zap-app:3000/admin/roofers
        method: GET
      - url: http://sv-zap-app:3000/admin/surveys
        method: GET
      - url: http://sv-zap-app:3000/admin/users
        method: GET
      - url: http://sv-zap-app:3000/unavailable
        method: GET
      - url: http://sv-zap-app:3000/auth/redirect
        method: GET
      - url: http://sv-zap-app:3000/dashboard
        method: GET
      - url: http://sv-zap-app:3000/properties
        method: GET
      - url: http://sv-zap-app:3000/properties/new
        method: GET
      - url: http://sv-zap-app:3000/properties/svzap-property-a
        method: GET
      - url: http://sv-zap-app:3000/surveys
        method: GET
      - url: http://sv-zap-app:3000/surveys/new
        method: GET
      - url: http://sv-zap-app:3000/surveys/svzap-survey-s1
        method: GET
      - url: http://sv-zap-app:3000/surveys/svzap-survey-s2/report
        method: GET
      - url: http://sv-zap-app:3000/surveys/svzap-survey-s3/report
        method: GET
      - url: http://sv-zap-app:3000/quotes
        method: GET
  - type: spider
    parameters:
      context: skyvault
      url: http://sv-zap-app:3000
      maxDuration: 3
  - type: passiveScan-wait
    parameters:
      maxDuration: 5
  - type: activeScan
    parameters:
      context: skyvault
      maxScanDurationInMins: 20
  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk/out
      reportFile: report-admin-active.json
      reportTitle: admin-active
